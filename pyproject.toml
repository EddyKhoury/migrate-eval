[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrate-eval"
version = "0.1.0"
description = "LLM-assisted code migration benchmark with tests as the oracle"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "openai",
    "httpx",
    "pandas",
    "matplotlib",
    "typer",
    "python-dotenv",
]

[project.scripts]
migrate-eval = "migrate_eval.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]